<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <rect width="600" height="600" fill="#ffffff"/>
  <defs>
    <radialGradient id="cpuShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00204a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00204a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pcbGrad" x1="120" y1="120" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d5b49"/>
      <stop offset="100%" stop-color="#073b2f"/>
    </linearGradient>
    <linearGradient id="ihsGrad" x1="165" y1="150" x2="435" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="180" y1="180" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00bbf0"/>
      <stop offset="100%" stop-color="#005792"/>
    </linearGradient>
  </defs>
  <ellipse cx="300" cy="488" rx="190" ry="26" fill="url(#cpuShadow)"/>
  <g transform="translate(300 288) rotate(-8)">
    <!-- PCB Substrate -->
    <rect x="-175" y="-175" width="350" height="350" rx="18" fill="url(#pcbGrad)" stroke="#0f766e" stroke-width="3"/>
    <!-- SMD Capacitors around edges -->
    <g fill="#d4af37" opacity="0.9">
      <rect x="-152" y="-140" width="12" height="6" rx="1.5"/>
      <rect x="-152" y="-122" width="12" height="6" rx="1.5"/>
      <rect x="-152" y="114" width="12" height="6" rx="1.5"/>
      <rect x="-152" y="132" width="12" height="6" rx="1.5"/>
      <rect x="140" y="-140" width="12" height="6" rx="1.5"/>
      <rect x="140" y="-122" width="12" height="6" rx="1.5"/>
      <rect x="140" y="114" width="12" height="6" rx="1.5"/>
      <rect x="140" y="132" width="12" height="6" rx="1.5"/>
      <rect x="-132" y="-158" width="6" height="12" rx="1.5"/>
      <rect x="-112" y="-158" width="6" height="12" rx="1.5"/>
      <rect x="106" y="-158" width="6" height="12" rx="1.5"/>
      <rect x="126" y="-158" width="6" height="12" rx="1.5"/>
      <rect x="-132" y="146" width="6" height="12" rx="1.5"/>
      <rect x="-112" y="146" width="6" height="12" rx="1.5"/>
      <rect x="106" y="146" width="6" height="12" rx="1.5"/>
      <rect x="126" y="146" width="6" height="12" rx="1.5"/>
    </g>
    <!-- Pin 1 Golden Triangle -->
    <polygon points="-155,155 -155,135 -135,155" fill="#fdb44b"/>
    <!-- Integrated Heat Spreader (AM5 style cutouts) -->
    <path d="M-118,-132 L118,-132 L132,-118 L132,-70 L118,-56 L118,-22 L132,-8 L132,8 L118,22 L118,56 L132,70 L132,118 L118,132 L-118,132 L-132,118 L-132,70 L-118,56 L-118,22 L-132,8 L-132,-8 L-118,-22 L-118,-56 L-132,-70 L-132,-118 Z"
          fill="url(#ihsGrad)" stroke="#64748b" stroke-width="3"/>
    <!-- Inner machined bevel -->
    <rect x="-92" y="-92" width="184" height="184" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2"/>
    <!-- Brand geometric emblem -->
    <rect x="-56" y="-56" width="112" height="112" rx="14" fill="#00204a" fill-opacity="0.07" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <path d="M-28,-22 L28,-22 L28,22 L10,22 L10,-4 L-10,-4 L-10,22 L-28,22 Z" fill="#00204a" opacity="0.82"/>
    <rect x="-24" y="32" width="48" height="6" rx="3" fill="#fdb44b"/>
  </g>
</svg>

