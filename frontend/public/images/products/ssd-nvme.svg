<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <rect width="600" height="600" fill="#ffffff"/>
  <defs>
    <radialGradient id="ssdShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00204a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00204a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ssdBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ssdMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <ellipse cx="300" cy="465" rx="215" ry="26" fill="url(#ssdShadow)"/>
  <g transform="translate(300 295) rotate(-26)">
    <!-- M.2 PCB -->
    <rect x="-220" y="-72" width="440" height="144" rx="8" fill="url(#ssdBody)" stroke="#334155" stroke-width="2.5"/>
    <!-- M.2 Gold Edge Connector (left) -->
    <rect x="-242" y="-56" width="24" height="112" rx="3" fill="#0f172a"/>
    <g fill="#eab308">
      <rect x="-242" y="-50" width="22" height="7" rx="1"/>
      <rect x="-242" y="-39" width="22" height="7" rx="1"/>
      <rect x="-242" y="-28" width="22" height="7" rx="1"/>
      <rect x="-242" y="-17" width="22" height="7" rx="1"/>
      <rect x="-242" y="14" width="22" height="7" rx="1"/>
      <rect x="-242" y="25" width="22" height="7" rx="1"/>
      <rect x="-242" y="36" width="22" height="7" rx="1"/>
    </g>
    <!-- M-Key notch -->
    <rect x="-244" y="-5" width="18" height="13" rx="2" fill="#ffffff"/>
    <!-- Screw semicircle (right) -->
    <circle cx="218" cy="0" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <!-- Graphene / aluminum heatsink -->
    <rect x="-180" y="-60" width="365" height="120" rx="6" fill="url(#ssdMetal)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Ribbed cooling channels -->
    <line x1="-160" y1="-40" x2="165" y2="-40" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <line x1="-160" y1="-28" x2="165" y2="-28" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <line x1="-160" y1="28" x2="165" y2="28" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <line x1="-160" y1="40" x2="165" y2="40" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Center Tech Label Plate -->
    <rect x="-135" y="-18" width="275" height="36" rx="4" fill="#00204a"/>
    <rect x="-135" y="-18" width="12" height="36" rx="2" fill="#fdb44b"/>
    <rect x="-105" y="-6" width="130" height="5" rx="2.5" fill="#00bbf0"/>
    <rect x="-105" y="5" width="84" height="4" rx="2" fill="#cbd5e1" opacity="0.8"/>
    <circle cx="115" cy="0" r="8" fill="#fdb44b"/>
  </g>
</svg>

